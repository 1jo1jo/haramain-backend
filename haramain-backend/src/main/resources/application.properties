```properties
spring.application.name=haramain-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://haramain-meal-db-haramain-meal.d.aivencloud.com:19355/haramain_meal?sslMode=REQUIRED&serverTimezone=Asia/Riyadh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

logging.level.com.zaxxer.hikari=DEBUG
server.port=${PORT:8080}
```
